name: Build Bingr TV and Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: unzip -q BingrTV-TV-and-Mobile-Source.zip
      - name: Build both APKs
        run: gradle -p BingrTV assembleTvDebug assembleMobileDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bingr-TV-APK
          path: BingrTV/app/build/outputs/apk/tv/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bingr-Mobile-APK
          path: BingrTV/app/build/outputs/apk/mobile/debug/*.apk
