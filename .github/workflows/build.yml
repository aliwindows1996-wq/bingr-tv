name: Build Bingr TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q BingrTV-AndroidStudio-Project.zip

      - name: Build APK
        run: gradle -p BingrTV assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Bingr-TV-APK
          path: BingrTV/app/build/outputs/apk/debug/app-debug.apk
